<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Chat</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1565c0">

<link rel="stylesheet" href="common.css">

<style>
 #chatName{
text-align:center;
font-size:28px;
font-weight:800;
color:#111;
margin-bottom:18px;
}

#messages{
height:60vh;
overflow-y:auto;
padding:18px;
background:rgba(255,255,255,.75);
backdrop-filter:blur(8px);
border-radius:28px;
box-shadow:0 12px 25px rgba(0,0,0,.15);
display:flex;
flex-direction:column;
gap:12px;
margin-bottom:18px;
}

.message{
max-width:75%;
padding:12px 16px;
border-radius:20px;
font-size:16px;
line-height:1.5;
word-break:break-word;
box-shadow:0 5px 12px rgba(0,0,0,.08);
}

.myMessage{
align-self:flex-end;
background:#111;
color:#fff;
border-bottom-right-radius:6px;
}

.otherMessage{
align-self:flex-start;
background:#fff;
color:#111;
border-bottom-left-radius:6px;
}

.inputArea{
display:flex;
align-items:center;
gap:12px;
background:#fff;
padding:12px;
border-radius:25px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

#messageInput{
flex:1;
margin:0;
padding:15px 18px;
border:none;
outline:none;
border-radius:18px;
background:#f7f7f7;
font-size:16px;
box-shadow:none;
}

#sendBtn{
width:55px !important;
height:55px !important;
margin:0 !important;
padding:0 !important;
border:none;
border-radius:50%;
background:#111;
color:#fff;
font-size:22px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
flex-shrink:0;
}

#sendBtn:active{
transform:scale(.95);
}

@media(max-width:480px){

#chatName{
font-size:24px;
}

#messages{
height:58vh;
}

.message{
max-width:85%;
font-size:15px;
}

#sendBtn{
width:50px !important;
height:50px !important;
font-size:20px;
}

}
</style>

</head>

<body>

<div class="bg-circle c1"></div>
<div class="bg-circle c2"></div>

<div class="container">

    <h2 id="chatName">Loading...</h2>

    <div id="messages"></div>

    <div class="inputArea">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message...">

        <button id="sendBtn">➤</button>

    </div>

</div>

<script type="module" src="chat.js"></script>

</body>
</html>
