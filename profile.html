<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1565c0">
<link rel="stylesheet" href="common.css">

<title>Profile</title>

<style>
.logo{
display:flex;
justify-content:center;
margin-bottom:20px;
}

.profilePic{
width:130px;
height:130px;
margin:0 auto 18px;
border-radius:50%;
overflow:hidden;
background:white;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 10px 20px rgba(0,0,0,.15);
position:relative;
}

.profilePic img{
width:100%;
height:100%;
object-fit:cover;
display:none;
}

#defaultAvatar{
font-size:65px;
}

#changePhotoBtn,
#deletePhotoBtn{
margin:8px 0;
}

h1{
margin-top:18px;
margin-bottom:8px;
}

.email{
text-align:center;
font-size:17px;
color:#555;
margin-bottom:20px;
}

.statsRow{
margin:25px 0;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:15px;
margin:20px 0;
}

.statBox{
background:white;
border-radius:22px;
padding:18px;
text-align:center;
box-shadow:0 8px 18px rgba(0,0,0,.12);
}

.statBox h3{
font-size:28px;
margin-bottom:6px;
}

.statBox p{
font-size:16px;
color:#555;
}

.actionBox{
display:flex;
gap:12px;
margin-top:15px;
}

.actionBox button{
flex:1;
margin-top:0;
}

.sectionTitle{
font-size:26px;
margin:28px 0 18px;
}

.info{
background:white;
padding:16px;
border-radius:18px;
margin-bottom:14px;
box-shadow:0 8px 18px rgba(0,0,0,.12);
font-size:17px;
line-height:1.5;
}

.postCard{
background:white;
padding:18px;
border-radius:20px;
margin-bottom:15px;
box-shadow:0 8px 18px rgba(0,0,0,.12);
}

#logoutBtn{
margin-top:25px;
background:#e53935;
}

#closeList{
margin-top:20px;
}

hr{
border:none;
height:2px;
background:rgba(0,0,0,.08);
margin:30px 0;
}

@media(max-width:480px){

.profilePic{
width:110px;
height:110px;
}

#defaultAvatar{
font-size:55px;
}

.stats{
grid-template-columns:1fr;
}

.actionBox{
flex-direction:column;
}

.sectionTitle{
font-size:22px;
}

.info{
font-size:16px;
}

}
</style>
<body>

<div class="container">

<div style="text-align:center;">

<div class="profilePic" id="profilePic">

<img id="profileImage" src="">

<span id="defaultAvatar">👤</span>

</div>

<input
type="file"
id="profileInput"
accept="image/*"
style="display:none;">

<button id="changePhotoBtn">
📷 Change Profile Picture
</button>

<button id="deletePhotoBtn">
🗑 Remove Profile Picture
</button>

<h1 id="name">Loading...</h1>

<p id="email" class="email"></p>

</div>

<div class="statsRow">

<div class="stats">

<div class="statBox" id="followersBox">

<h3 id="followersCount">0</h3>

<p>Followers</p>

</div>

<div class="statBox" id="followingBox">

<h3 id="followingCount">0</h3>

<p>Following</p>

</div>

</div>

<div
id="actionButtons"
class="actionBox">

<button id="messageBtn">
💬 Message
</button>

<button id="followBtn">
➕ Follow
</button>

</div>

</div>

<hr>

<h2 class="sectionTitle">
📊 My Statistics
</h2>

<div class="stats">

<div class="statBox">

<h3 id="totalPosts">0</h3>

<p>Posts</p>

</div>

<div class="statBox">

<h3 id="totalLikes">0</h3>

<p>Likes</p>

</div>

<div class="statBox">

<h3 id="totalComments">0</h3>

<p>Comments</p>

</div>

</div>

<hr>

<h2 class="sectionTitle">
📝 My Posts
</h2>

<div id="myPosts">

<div class="postCard"
style="text-align:center;color:#666;">

Loading your posts...

</div>

</div>

<hr>

<h2 class="sectionTitle">
📋 Personal Information
</h2>
<div class="info">
<strong>Gender:</strong>
<span id="gender"></span>
</div>

<div class="info">
<strong>Intellect:</strong>
<span id="intellect"></span>
</div>

<div class="info">
<strong>Favourite Work:</strong>
<span id="work"></span>
</div>

<div class="info">
<strong>Bakchodi Experience:</strong>
<span id="experience"></span>
</div>

<div class="info">
<strong>Reason to Join Club:</strong>
<span id="reason"></span>
</div>

<div class="info">
<strong>Comment:</strong>
<span id="comment"></span>
</div>

<button id="logoutBtn">Logout</button>

</div>

<div id="memberList" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
z-index:1000;
">

<div style="
background:white;
width:90%;
max-width:500px;
margin:60px auto;
padding:20px;
border-radius:20px;
max-height:70%;
overflow:auto;
">

<h2 id="listTitle">Members</h2>

<div id="listContent"></div>

<button id="closeList">
Close
</button>

</div>

</div>

<script type="module" src="profile.js"></script>

</body>
</html>
