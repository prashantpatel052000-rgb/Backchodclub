<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<meta
    name="theme-color"
    content="#1565c0">

<link
    rel="stylesheet"
    href="common.css">

<title>Voice Call</title>


<style>

/* ================================
   PAGE
================================ */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #b8f5ff 0%,
            #61e3e5 50%,
            #71dfc0 100%
        );

    font-family: Poppins, Arial, sans-serif;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 18px;

}


/* ================================
   MAIN CALL CARD
================================ */

.callCard {

    width: 100%;

    max-width: 430px;

    background:
        rgba(255,255,255,0.48);

    backdrop-filter: blur(14px);

    -webkit-backdrop-filter: blur(14px);

    border:
        1px solid
        rgba(255,255,255,0.75);

    border-radius: 32px;

    padding:
        32px
        22px
        28px;

    text-align: center;

    box-shadow:
        0 15px 35px
        rgba(0,0,0,0.15);

    animation:
        cardAppear
        0.45s
        ease;

}


/* ================================
   CALL TITLE
================================ */

.callType {

    font-size: 21px;

    color: #333;

    margin-bottom: 28px;

}


/* ================================
   PROFILE PICTURE
================================ */

.avatar {

    width: 150px;

    height: 150px;

    margin:
        0
        auto
        22px;

    border-radius: 50%;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #08d9a5,
            #16c784
        );

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        6px solid
        rgba(255,255,255,0.75);

    box-shadow:
        0 10px 25px
        rgba(0,0,0,0.16);

}


/*
   IMPORTANT:
   The image completely fills
   the circular container.
*/

.avatar img {

    width: 100%;

    height: 100%;

    display: none;

    object-fit: cover;

    object-position: center;

}


/* Default avatar */

.avatarFallback {

    width: 100%;

    height: 100%;

    display: none;

    align-items: center;

    justify-content: center;

    font-size: 62px;

    font-weight: 800;

    color: #111;

}


/* ================================
   CALLER NAME
================================ */

#callerName {

    margin:
        8px
        0
        10px;

    font-size: 30px;

    line-height: 1.2;

    font-weight: 800;

    color: #111;

    word-break: break-word;

}


/* ================================
   CALL STATUS
================================ */

.callStatus {

    font-size: 18px;

    color: #444;

    margin-bottom: 30px;

}


/* ================================
   BUTTONS
================================ */

.callButtons {

    display: flex;

    justify-content: center;

    gap: 16px;

}


.callButtons button {

    border: none;

    width: 125px;

    height: 58px;

    border-radius: 30px;

    font-size: 17px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 8px 17px
        rgba(0,0,0,0.16);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;

}


.callButtons button:active {

    transform: scale(0.94);

    box-shadow:
        0 4px 10px
        rgba(0,0,0,0.15);

}


/* Accept */

#acceptBtn {

    background: #111;

    color: white;

}


/* Reject */

#rejectBtn {

    background: #e53935;

    color: white;

}

#cancelBtn {

    display: none;

    width: min(250px, 100%);

    background: #111;

    color: white;

}

.callButtons button:disabled {

    opacity: 0.55;

    cursor: default;

    transform: none;

}


/* ================================
   FOOTER
================================ */

.freeText {

    margin-top: 25px;

    font-size: 14px;

    color: #555;

}


/* ================================
   ANIMATION
================================ */

@keyframes cardAppear {

    from {

        opacity: 0;

        transform:
            translateY(20px)
            scale(0.96);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* ================================
   MOBILE
================================ */

@media (max-width: 480px) {

    body {

        padding: 14px;

    }


    .callCard {

        padding:
            28px
            18px
            25px;

        border-radius: 28px;

    }


    .callType {

        font-size: 19px;

        margin-bottom: 24px;

    }


    .avatar {

        width: 130px;

        height: 130px;

        margin-bottom: 20px;

    }


    .avatarFallback {

        font-size: 54px;

    }


    #callerName {

        font-size: 27px;

    }


    .callStatus {

        font-size: 17px;

        margin-bottom: 26px;

    }


    .callButtons {

        gap: 12px;

    }


    .callButtons button {

        width: 115px;

        height: 55px;

        font-size: 16px;

    }

}


/* ================================
   SMALL HEIGHT PHONES
================================ */

@media (max-height: 650px) {

    .callCard {

        padding:
            20px
            18px
            22px;

    }


    .callType {

        margin-bottom: 16px;

    }


    .avatar {

        width: 105px;

        height: 105px;

        margin-bottom: 14px;

    }


    .avatarFallback {

        font-size: 44px;

    }


    #callerName {

        font-size: 24px;

    }


    .callStatus {

        margin-bottom: 18px;

    }


    .freeText {

        margin-top: 17px;

    }

}

</style>

</head>


<body>


<!-- =================================
     INCOMING CALL CARD
================================= -->

<div class="callCard">


    <!-- Call type -->

    <div class="callType">

        📞 Incoming Voice Call

    </div>


    <!-- Caller profile -->

    <div class="avatar">


        <img
            id="callerPhoto"
            src=""
            alt="Caller Profile Picture">


        <!--
            Hidden by default.
            It will only appear when
            there is no profile picture.
        -->

        <span
            id="profilePlaceholder"
            class="avatarFallback">

            👤

        </span>


    </div>


    <!-- Caller name -->

    <h2 id="callerName">

        Incoming Call

    </h2>


    <!-- Status -->

    <div class="callStatus">

        📞 Calling you...

    </div>


    <!-- Buttons -->

    <div class="callButtons">


        <button id="acceptBtn">

            ✓ Accept

        </button>


        <button id="rejectBtn">

            ✕ Reject

        </button>


        <button id="cancelBtn">

            ✕ Cancel Call

        </button>


    </div>


    <!-- Footer -->

    <div class="freeText">

        Bakchod Club Voice Calling

    </div>


</div>


<!-- Your existing call system -->

<script
    type="module"
    src="incomingCall.js">
</script>


</body>

</html>
